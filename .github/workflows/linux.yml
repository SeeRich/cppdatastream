name: Linux Build

on: push

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a build matrix
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]
        compiler: [gcc, clang]
        include:
          - cc: gcc-13
            cxx: g++-13
            std: 20
            compiler: gcc
            compiler_version: 13
            libcxx: libstdc++11
            install: sudo apt install -y g++-13
          - cc: clang-19
            cxx: clang++-19
            std: 20
            compiler: clang
            compiler_version: 19
            libcxx: libc++
            install: |
              wget https://apt.llvm.org/llvm.sh
              sudo bash ./llvm.sh 19
              sudo apt install -y clang-format clang-tidy clang-tools clang clangd \
                libc++1 libc++abi1 libclang1 \
                libomp5 lld lldb \
                llvm-runtime llvm

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install C++ Compiler
        run: ${{ matrix.install }}

      - name: Set Compiler Environment Variables
        run: |
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          version: 1.11.1

      - name: Install Conan
        id: conan
        uses: turtlebrowser/get-conan@main

      - name: Conan version
        run: echo "${{ steps.conan.outputs.version }}"

      - name: Build Conan Dependencies
        # We build the conan dependencies in release but install the config relating to the matrix build type.
        run: |
          conan profile detect
          conan install ${{ github.workspace }} --output-folder=${{ github.workspace }}/deps \
            --build missing \
            -s "&:build_type=${{ matrix.build_type }}" -s :build_type=Release
            -s compiler=${{ matrix.compiler }} \
            -s compiler.version=${{ matrix.compiler_version }} \
            -s compiler.libcxx=${{ matrix.libcxx }}

      - name: CMake Configure
        run: >
          cmake -S ${{ github.workspace }}
          -B ${{ steps.strings.outputs.build-output-dir }}
          -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_CXX_FLAGS=${{ matrix.compiler == 'clang' && '-stdlib=libc++' || '' }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_EXAMPLES=ON

      - name: Build
        run: |
          threads=`nproc`
          cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel $threads

    # - name: Test
    #   working-directory: ${{ steps.strings.outputs.build-output-dir }}
    #   # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
    #   # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
    #   run: ctest --build-config ${{ matrix.build_type }}
